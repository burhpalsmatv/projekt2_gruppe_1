<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Valdemar er en taeber</title>
    <link rel="stylesheet" href="../static/style.css" th:href="@{style.css}">
</head>

<body>

<div class=container>
    <div class="headerArea">
        <div class="header" style="height: 150px;">
        </div>
        <nav class="navbar" style="margin-bottom: 10px;">
            <ul>
                <li><a th:href="@{/index}">Home</a></li>
                <li><a th:href="@{/wishlist}">Ønskelister</a></li>
            </ul>
        </nav>
    </div>

    <div class="flex">
        <main>
            <div class="wishBox" th:each="wishlist : ${listOfWishlist}">
                <a th:href="@{/getWishes(wishlistId=${wishlist.wishlistId})}" class="btn"><div>
                    <label>Titel</label>
                    <span th:text="${wishlist.wishlistTitle}">title</span>

                </div></a>
            </div>
            <a class="btn" th:href="@{/getCreateWishlist(userWishlistId=${userWishlistId})}">
                Opret ønskeliste
            </a>
        </main>
    </div>
</div>
</body>
</html>
