<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Ønskelister - ØnskeÆsken</title>
    <link rel="stylesheet" href="../static/style.css" th:href="@{style.css}">
    <link rel="stylesheet" href="../static/header.css" th:href="@{header.css}">

</head>

<body>
<div id="header-container">
    <header>
        <div id="header-left">
            <a id="header-logo" th:href="@{/}">
                <img th:src="@{/defaultImages/logo.png}">
            </a>

            <a class="header-link" th:href="@{/omos}">Om Os</a>
            <a class="header-link" th:href="@{/wishlist}">ØnskeLister</a>
        </div>

        <div id="header-right">
            <!-- Log ind -->
            <div class="header-button">
                <a href="../templates/login.html" class="button">
                    Log ind
                </a>
                </label>

            </div>

            <!-- Opret profil -->
            <div class="header-button">
                <a href="../templates/opretprofil.html" class="button">
                    Opret profil
                </a>
                </label>

            </div>
        </div>
    </header>
</div>

<div class=container>
    <div class="flex">
        <main>
            <div class="boxMedium" th:each="wishlist : ${listOfWishlist}">
                <a th:href="@{/getWishes(wishlistId=${wishlist.wishlistId})}" class="btn"><div>
                    <label>Titel</label>
                    <span th:text="${wishlist.wishlistTitle}">title</span>
                </div></a>
            </div>
            <a class="btn" th:href="@{/getCreateWishlist(userWishlistId=${userWishlistId})}">
                Opret ønskeliste
            </a>
        </main>
    </div>
</div>
</body>
</html>
