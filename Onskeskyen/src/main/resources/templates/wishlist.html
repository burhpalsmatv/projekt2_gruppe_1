<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Ønskelister - ØnskeÆsken</title>
    <link rel="stylesheet" href="../static/style.css" th:href="@{style.css}">

</head>

<body>
<div th:replace="~{fragments/header :: header}">Header</div>
    <div class="wishContainer">
        <main>
            <h1>ØnskeLister</h1>

            <a class="button" th:href="@{/getCreateWishlist(userWishlistId=${userWishlistId})}">
                Opret ønskeliste
            </a>


            <div class="wishScroll">
                <div class="boxMedium" th:each="wishlist : ${listOfWishlist}">
                    <a th:href="@{/getWishes(wishlistId=${wishlist.wishlistId})}" class="btn">
                        <div>
                            <label>Titel:</label>
                            <span th:text="${wishlist.wishlistTitle}">title</span>
                        </div>
                    </a>

                    <form th:action="@{/postDeleteWishlist}" method="post">
                        <input type="hidden" name="wishlistId" th:value="${wishlist.getWishlistId()}">

                        <button class="button" type="submit">
                            <a th:action="@{/postDeleteWishlist}">* Slet Ønskeliste *</a>
                        </button>
                    </form>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
