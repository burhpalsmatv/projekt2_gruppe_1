<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Ønskelister - ØnskeÆsken</title>
    <link rel="stylesheet" href="../static/style.css" th:href="@{style.css}">

</head>

<body>
<div th:replace="~{fragments/header :: header}">Header</div>
<div class=container>
    <div class="flex">
        <main>
            <div class="boxMedium" th:each="wishlist : ${listOfWishlist}">
                <a th:href="@{/getWishes(wishlistId=${wishlist.wishlistId})}" class="btn"><div>
                    <label>Titel</label>
                    <span th:text="${wishlist.wishlistTitle}">title</span>
                </div></a>

                <div>
                    <form th:action="@{/postDeleteWishlist}" method="post">
                        <input type="hidden" name="wishlistId" th:value="${wishlist.getWishlistId()}">

                        <button class="btn" type="submit">* Slet Ønskeliste *</button>
                    </form>
                </div>
            </div>
            <a class="btn" th:href="@{/getCreateWishlist(userWishlistId=${userWishlistId})}">
                Opret ønskeliste
            </a>
        </main>
    </div>
</div>
</body>
</html>
