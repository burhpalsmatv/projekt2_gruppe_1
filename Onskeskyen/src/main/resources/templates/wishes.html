<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ønsker - ØnskeÆsken</title>
  <link rel="stylesheet" href="../static/style.css" th:href="@{style.css}">
  <link rel="stylesheet" href="../static/header.css" th:href="@{header.css}">

</head>

<body>
<div id="header-container">
  <header>
    <div id="header-left">
      <a id="header-logo" th:href="@{/}">
        <img th:src="@{/defaultImages/logo.png}">
      </a>

      <a class="header-link" href="../templates/omos.html">Om Os</a>
      <a class="header-link" href="../templates/wishlist.html">ØnskeLister</a>
    </div>

    <div id="header-right">
      <!-- Log ind -->
      <div class="header-button">
        <a href="../templates/login.html" class="button">
          Log ind
        </a>
        </label>

      </div>

      <!-- Opret profil -->
      <div class="header-button">
        <a href="../templates/opretprofil.html" class="button">
          Opret profil
        </a>
        </label>

      </div>
    </div>
  </header>
</div>

<body>
  <div class="wishContainer">
    <main>
      <br><br>
      <h1>Ønsker</h1>
      <div class="wishScroll">
      <div class="wishBox" th:each="wish : ${listOfWishes}">
        <img th:src="@{'/img/' + ${wish.getWishImg()}}" alt="wish image"/>
        <div>
          <label>Titel:</label>
          <span th:text="${wish.getTitle()}">Titel</span>
        </div>
        <div>
          <label>Pris:</label>
          <span th:text="${wish.getPrice()} + DKK">Pris</span>
        </div>
        <div>
          <label>Note:</label>
          <span th:text="${wish.getNote()}">Note</span>
        </div>
        <div>
          <label><a th:href="${wish.getLink()}">Link</a></label>
        </div>
        <div>
          <label>Billede:</label>
          <span th:text="${wish.getWishImg()}">Billede</span>
        </div>
        <div>
          <label>Prioteret ønske:</label>
          <span th:text="${wish.getPriority()}">Prioteret ønske</span>
        </div>
        <div>
          <label>Ønske liste nr:</label>
          <span th:text="${wish.getWishlistId()}">Wishlist</span>
        </div>
        <div> <!-- giv wishId og wishlistId videre til getEditWish i wishController -->
          <a class="btn" th:href="@{/getEditWish(wishId=${wish.getWishId()}, wishListId=${wish.getWishlistId()})}">
            Edit
          </a>
        </div>
      </div>
      </div>

      <a class="btn" th:href="@{/getCreateWish(wishlistId=${wishlistId})}">
        Opret ønske
      </a>

    </main>
  </div>
</div>
</body>
</html>
