<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Ønsker - ØnskeÆsken</title>
    <link rel="stylesheet" href="../static/style.css" th:href="@{style.css}">

</head>

<body>
<div th:replace="~{fragments/header :: header}">Header</div>
<div class="wishContainer">
    <main>

      <br><br>

      <h1>
        <label>Ønskeliste:</label>
        <span th:text="${wishlistId}"></span>
      </h1>

      <!-- The passed listOfWishes can be used in this HTML file (see HomeController.getAllWishes())-->
      <a class="btn" th:href="@{/getCreateWish(wishlistId=${wishlistId})}">
        Opret ønske
      </a>


      <div class="wishScroll">
      <div class="wishBox" th:each="wish : ${listOfWishes}">
        <img th:src="@{${wish.getWishImg()}}" alt="wish image"/>

        <div>
          <label>Titel:</label>
          <span th:text="${wish.getTitle()}">Titel</span>
        </div>

        <div>
          <label>Pris:</label>
          <span th:text="${wish.getPrice()} + DKK">Pris</span>
        </div>

        <div>
          <label>Note:</label>
          <span th:text="${wish.getNote()}">Note</span>
        </div>

        <div>
          <label><a th:href="${wish.getLink()}">✨Link✨</a></label>
        </div>

        <div>
          <span th:if="${wish.getPriority()}">Prioteret ønske</span>
        </div>

        <!-- This GET request sends the selected wish data to the controller when the user clicks
              on Rediger. the controller uses this information to prepare the edit viev (see WishController)-->
        <div>
          <form th:action="@{/getEditWish}" method="get">
            <input type="hidden" name="wishId" th:value="${wish.getWishId()}">
            <input type="hidden" name="wishlistId" th:value="${wish.getWishlistId()}">
            <input type="hidden" name="title" th:value="${wish.getTitle()}">
            <input type="hidden" name="price" th:value="${wish.getPrice()}">
            <input type="hidden" name="note" th:value="${wish.getNote()}">
            <input type="hidden" name="link" th:value="${wish.getLink()}">
            <input type="hidden" name="wishImg" th:value="${wish.getWishImg()}">
            <input type="hidden" name="priority" th:value="${wish.getPriority()}">

            <button class="button" type="submit">Rediger</button>
          </form>
              <form th:action="@{/postDeleteWish}" method="post">
                <input type="hidden" name="wishId" th:value="${wish.getWishId()}">
                <input type="hidden" name="wishlistId" th:value="${wish.getWishlistId()}">

                <button class="button" type="submit">Slet</button>
              </form>
        </div>



      </div>
      </div>

    </main>
  </div>

</body>

</html>
