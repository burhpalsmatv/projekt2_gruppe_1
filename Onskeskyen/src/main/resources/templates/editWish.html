<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Rediger - ØnskeÆsken</title>
    <link rel="stylesheet" href="../static/style.css" th:href="@{style.css}">

</head>

<body>
<div th:replace="~{fragments/header :: header}">Header</div>
<div class="form-container">
    <div class="form-section">
        <h2>Rediger ønske</h2>
        <form th:action="@{/postEditWish}" method="post">
            <label for="title">Titel:</label>
            <input type="text" id="title" name="title" th:value="${title}" required>

            <label for="price">Pris:</label>
            <input type="number" id="price" name="price" th:value="${price}" required>

            <label for="note">Note:</label>
            <input type="text" id="note" name="note" th:value="${note} ?: ''">
            <label for="link">Link:</label>
            <input type="text" id="link" name="link" th:value="${link} ?: ''">

            <label for="wishImg">Billede:</label>
            <input type="text" id="wishImg" name="wishImg" th:value="${wishId}">

            <label for="priority">Prioriteret ønske?</label>
            <input type="checkbox" id="priority" name="priority" th:value="true" th:checked="${priority}">

            <input type="hidden" id="wishlistId" name="wishlistId" th:value="${wishlistId}">

            <input type="hidden" id="wishId" name="wishId" th:value="${wishId}">


            <button type="submit">Rediger ønske</button>
        </form>
    </div>
</div>
</body>
</html>
