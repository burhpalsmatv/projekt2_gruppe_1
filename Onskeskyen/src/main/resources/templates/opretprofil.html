<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>ØnskeÆsken</title>
    <link rel="stylesheet" href="../static/style.css" th:href="@{style.css}">


</head>

<body>
<div th:replace="~{fragments/header :: header}">Header</div>

<div class="ex1">

    <h1>Opret en profil</h1>

    <div class="form-container">

        <!-- Personlige oplysninger -->
        <div class="form-section">

            <h4>Personlige oplysninger</h4>

            <label for="fname">Fornavn</label>
            <input type="text" id="fname" required>

            <label for="lname">Efternavn</label>
            <input type="text" id="lname" required>

            <label for="phonenumber">Tlf.nr</label>
            <input type="tel" id="phonenumber" required>

            <label for="age">Alder</label>
            <input type="number" id="age">

        </div>

        <!-- Login oplysninger -->
        <div class="form-section">

            <h4>Login oplysninger</h4>

            <label for="email">E-mail</label>
            <input type="email" id="email" required>

            <label for="password">Adgangskode</label>
            <input type="password" id="password" required>

            <label for="repeat-password">Gentag adgangskode</label>
            <input type="password" id="repeat-password" required>

        </div>

    </div>

    <br><br>

    <!-- Profilbilleder -->
    <div class="profile-avatars">
        <img th:src="@{/img-profil/avatar1.png}" alt="Profil 1" class="avatar">
        <img th:src="@{/img-profil/avatar2.png}" alt="Profil 2" class="avatar">
    </div>

    <br>

    <button type="submit">Opret profil</button>

    <br><br>

    <p>
        Har du allerede en profil?
        <a href="login.html">Log ind</a>
    </p>

</div>
</body>
</html>
