<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title> ØnskeÆsken </title>
    <link rel="stylesheet" href="../static/style.css" th:href="@{style.css}">

</head>

<body>
<div class="ex1">
<div class = "container">
    <div class="headerArea">
        <nav class="navbar" style="margin-bottom: 10px;">
            <ul>
                <li><a th:href="@{#}">Home</a></li>
                <li><a th:href="@{/wishlist}">Ønskelister</a></li>
            </ul>
        </nav>
    </div>
</div>


<h2> Opret en profil </h2>

<h4> Personlige oplysninger </h4>


    <Label for="fname"> Fornavn: </Label> <br>
    <input type="text" id="fname" required>

    <br>
    <br>

    <Label for="lname"> Efternavn: </Label> <br>
    <input type="text" id="lname" required>

    <br>
    <br>

    <Label for="phonenumber">Tlf.nr: </Label> <br>
    <input type="number" id="phonenumber" required>

    <br>
    <br>

    <Label for="age">Alder: </Label> <br>
    <input type="number" id="age">

    <br>
    <br>

    <h4> Login oplysninger </h4>

    <Label for="email">E-mail: </Label> <br>
    <input type="email" id="email" required>

    <br>
    <br>

    <Label for="password">Adgangskode: </Label> <br>
    <input type="password" id="password" required>

    <br>
    <br>

    <Label for="repeat password"> Gentag adgangskode: </Label> <br>
    <input type="repeat password" id="repeat password" required>

    <br>
    <br>

    <img th:src="@{/img-profil/avatar1.png" alt="Profil" class="avatar">
    <img th:src="@{/img-profil/avatar2.png}" alt="Profil" class="avatar">

    <br>
    <br>

    <button type="submit">Opret profil</button>

<p>
    <br>
    Har du allerede en profil?
    <a href="login.html" > Log ind</a>
</p>

</div>
</body>

</html>
