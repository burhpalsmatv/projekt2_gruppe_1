<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MainPage</title>
    <link rel="stylesheet" th:href="@{style.css}">
</head>

<body>
<div class = container>
    <div class="wishBox" th:each="wish : ${listOfWishes}">
        <div>
            <label>Titel</label>
            <span th:text="${wish.getTitle()}">Title</span>
        </div>
        <div>
            <label>Pris</label>
            <span th:text="${wish.getPrice()}">Pris</span>
        </div>
        <div>
            <label>WishListe ID</label>
            <span th:text="${wish.getWishListId()}">wishListId</span>
        </div>

    </div>
</div>
</body>
</html>
